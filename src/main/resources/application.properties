spring.application.name=StyleFit
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# PostgreSQL (개발용)
spring.datasource.url=jdbc:postgresql://localhost:5432/stylefit
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=ddalkkak
spring.datasource.password=ddalkkak0523!

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# schema.sql(밴 리스트 등 PK 없는 테이블)을 JPA 엔티티 테이블 생성 이후에 실행
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

stylefit.vision.yunet-model=classpath:models/face_detection_yunet_2023mar.onnx
stylefit.vision.min-brightness=60
stylefit.vision.max-brightness=210
stylefit.vision.face-score-threshold=0.9
stylefit.vision.min-face-area-ratio=0.08

# ----- 사진 검증 정확도 -----
# Laplacian variance — 작을수록 흐림. 일반적으로 100 이상이 선명.
stylefit.vision.min-blur-variance=80
# Yaw 비율 — (코-눈중점 수평거리 / 얼굴너비). 0.18 이상이면 측면 회전으로 간주.
stylefit.vision.max-yaw-ratio=0.18
# Pitch 비율 — (눈->코 / 코->입). 정면이 약 1.0 근처.
stylefit.vision.min-pitch-ratio=0.5
stylefit.vision.max-pitch-ratio=1.8
# 역광 — (얼굴 평균밝기 / 배경 평균밝기). 0.55 미만이면 얼굴이 배경보다 너무 어두움.
stylefit.vision.max-backlight-ratio=0.55
# 얼굴 ROI 의 HSV S(채도) 평균 허용 범위. 흑백/필터 떡칠 차단.
stylefit.vision.min-face-saturation=20
stylefit.vision.max-face-saturation=180

# 리포트 생성(/api/analysis/submit-photo) 일일 호출 한도 (서버 전체 글로벌 카운터)
stylefit.ratelimit.report-daily=100
# 쿠키 단위 일일 한도 (한 사용자가 쿠키 변경 + 무한 재시도로 글로벌 한도 소진하는 것 방지)
stylefit.ratelimit.per-cookie-daily=5
# IP 단위 일일 한도 (쿠키 우회용 2차 방어선)
stylefit.ratelimit.per-ip-daily=10

# ----- 보안 -----
# CORS 허용 도메인 (콤마 구분). 비어 있으면 dev 모드(모든 패턴 허용).
# 운영(application-prod.properties)에선 반드시 명시.
stylefit.security.allowed-origins=
# 쿠키 Secure 강제 모드. auto = 요청이 HTTPS 일 때만 / always = 항상
stylefit.security.cookie-secure=auto
# X-Forwarded-For 등 프록시 헤더를 신뢰할 IP 목록 (콤마 구분). 비어 있으면 헤더 무시.
stylefit.security.trusted-proxies=
# AI 모듈 outbound 호스트 화이트리스트 (SSRF 차단). "host" 또는 "host:port" 형식 콤마 구분.
# 비어 있으면(dev) 검증 skip — 운영에선 반드시 설정.
stylefit.security.ai-allowed-hosts=
stylefit.ai.base-url=http://localhost:8000

# ----- 어드민 -----
# 어드민 페이지(/admin) 로그인 비밀번호. 운영자 1명 단일 비밀번호.
# 사용자 요청으로 평문 보관 — 운영에선 환경변수 STYLEFIT_ADMIN_PASSWORD 로 주입 권장.
stylefit.admin.password=${STYLEFIT_ADMIN_PASSWORD:ddalkkak01!}

# 최초 분석 시 AI 모듈에서 받은 리포트 이미지를 디스크에 저장할 디렉토리.
# 정적 핸들러가 /report-images/** 로 매핑해 프론트에서 직접 GET 가능.
stylefit.report.storage-dir=./report-images

# 사용자가 업로드한 얼굴 원본 이미지를 저장할 디렉토리.
# 공개 URL 없음 (AI 학습·어드민 검토 전용). 운영에선 영속 볼륨 경로로 교체.
stylefit.face.storage-dir=./face-images

server.port=${PORT:8080}

# 공개 서비스 URL (OG 태그 생성에 사용). 운영 환경에서는 환경변수로 주입.
stylefit.base-url=${STYLEFIT_BASE_URL:http://www.lu-bello.com:8080}

# 모바일 사진 대응 (기본값 1MB → 20MB)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=60MB