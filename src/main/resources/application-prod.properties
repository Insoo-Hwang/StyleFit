# ===== 운영 프로파일 =====

# ----- PostgreSQL (운영 필수 주입) -----
spring.datasource.url=${STYLEFIT_DB_URL:jdbc:postgresql://localhost:5432/stylefit}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${STYLEFIT_DB_USERNAME:ddalkkak}
spring.datasource.password=${STYLEFIT_DB_PASSWORD:ddalkkak0523!}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# SQL 로그 비활성화
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 포트 (필요시 변경)
server.port=${PORT:8080}

# 리버스 프록시(Nginx 등) 헤더 신뢰 — X-Forwarded-Proto 로 HTTPS 인식
server.forward-headers-strategy=native

# ----- 보안 (운영 필수 주입) -----
# 운영 도메인을 콤마 구분으로 주입. 환경변수 STYLEFIT_ALLOWED_ORIGINS 사용 권장.
stylefit.security.allowed-origins=${STYLEFIT_ALLOWED_ORIGINS:}
# HTTPS 강제 환경이므로 쿠키 Secure 무조건 부여
stylefit.security.cookie-secure=always
# 프론트 앞단 리버스 프록시(Nginx) IP. 콤마 구분. 비워두면 XFF 헤더 무시.
stylefit.security.trusted-proxies=${STYLEFIT_TRUSTED_PROXIES:127.0.0.1}
# AI 모듈 호스트:포트 화이트리스트 (같은 도메인 다른 포트)
stylefit.security.ai-allowed-hosts=${STYLEFIT_AI_ALLOWED_HOSTS:}

# ----- 일일 한도 (운영 튜닝 가능) -----
stylefit.ratelimit.report-daily=${STYLEFIT_RATE_GLOBAL:100}
stylefit.ratelimit.per-cookie-daily=${STYLEFIT_RATE_COOKIE:5}
stylefit.ratelimit.per-ip-daily=${STYLEFIT_RATE_IP:10}
